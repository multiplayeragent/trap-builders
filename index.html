<script>
/* ═══ TRAP BUILDERS · a Multiplayer Agent starter ═══════════════════════════════════════
 * Build the level, then race it. Each round everyone grabs a piece from the box (platform,
 * spikes, spring, saw, crossbow or ice), places it, and then everyone runs from the start to
 * the flag. A level everyone beats, or nobody beats, pays little. Party, 2–8 players; bots fill seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ phase timers, points, physics, the pieces in the box, bots
 *   PIECES & LEVEL  the six pieces, the starting level drawn as text, building the level grid
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host, the shared clock
 *   HAZARDS ....... where saws and arrows are at a given time (a function of the shared clock)
 *   RUNNERS ....... one physics step for anyone (you or a bot): run, jump, ice, springs, dying
 *   ROUNDS (HOST) . pick → place → run → points → next round; the match winner. Only the host writes these.
 *   BOTS .......... the bot brain: picks a piece, places it somewhere nasty, runs the level (it tests jumps in its head)
 *   ME ............ your piece, your ghost, your runner. Each player writes only its own.
 *   DRAW .......... sky, the level, the pieces, ghosts, runners, particles
 *   HUD & CARDS ... round line, scores, the piece box, points card, match results, leaderboard
 *   INPUT ......... keyboard, mouse, and touch buttons
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one JSON field: position, speed, facing,
 *     animation, run id, dead/finished, which piece killed it, and its ghost piece while
 *     placing) about 12 times a second, `hb` (heartbeat) once a second, `n`/`c` (name, color).
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes:
 *       `game`  ONE JSON field: id, version v, match, round, phase pick|place|run|score|over,
 *               timestamps, the box of pieces (who took what, placed or not), the roster with
 *               points, the last round's results, the winner.
 *       `level` ONE JSON field: version v and the packed list of placed pieces [kind, x, y, facing, owner].
 *       `bots`  the bot runners and their ghost pieces (~10/s).   `clk`  its clock (every 2s).
 *     A new host adopts all of them and carries on from the same timestamps.
 *   - Saws and arrows move on the shared clock (their position is a function of time), so nobody streams them.
 *   - Intents to the host: "pick" {r, i} (I want box item i), "place" {r, x, y, o} (put my
 *     piece here), "again" {}. The host checks each one and writes the result into `game`/`level`.
 *   - Runs: each player runs its own body and reports finished/dead in its own `p`; the
 *     host scores the round from those once everyone is done (or the timer runs out).
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "trap-wins": +1 for every match you win, shown on the match results.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 4,              // bots fill the match up to this many builders
  maxPlayers: 8,         // more people than this watch until a seat frees up
  pickMs: 9000,          // ms to grab a piece from the box
  placeMs: 15000,        // ms to place it (unplaced pieces drop where their ghost is)
  countdown: 2500,       // ms of "3, 2, 1" before a run
  runMs: 30000,          // a run ends after this even if people are still going
  botsAloneMs: 5000,     // once every person is out or home, the bots get this long to finish
  scoreMs: 5500,         // ms the round's points show
  overMs: 16000,         // ms the match results show before a new match
  winPoints: 15,         // first to this many points wins the match
  maxRounds: 12,         // ...or whoever leads after this many rounds
  ptsFinish: 3,          // reaching the flag (when not everyone did)
  ptsFirst: 1,           // extra for the first one there
  ptsSolo: 2,            // extra when you're the only one who made it
  ptsTooEasy: 1,         // everyone made it: the level was too easy, 1 point each
  ptsTrap: 1,            // your piece knocked someone out (only if someone still made it)
  maxPieces: 44,         // the level keeps this many pieces; the oldest go first
  crumble: 3,            // after a round nobody beats, this many of the newest pieces break off
  boxWeights: { P: 3, I: 1.3, T: 1.5, S: 2.4, W: 2, X: 1.6 }, // how often each piece shows up in the box
  run: 7.5,              // run speed, tiles/s
  airControl: 12,        // how quickly you change speed in the air
  groundGrip: 18,        // ...on the ground
  iceGrip: 1.8,          // ...on ice (slippery!)
  jump: 16,              // jump speed, tiles/s (about 2.8 tiles high and 5 across)
  gravity: 46, maxFall: 20,
  cutJump: 2.4,          // let go of jump early and gravity pulls this much harder: a small hop
  coyote: 0.1, buffer: 0.12, // forgiving jumps (s): a little late off a ledge, a little early before landing
  spring: 23,            // a spring launches you this fast (about 5.7 tiles high)
  sawRange: 1.5,         // tiles a saw swings each way
  sawPeriod: 3.2,        // seconds for one swing there and back
  sawRadius: 0.5,        // tiles
  bowPeriod: 2.6,        // seconds between crossbow shots
  arrowSpeed: 8,         // tiles/s
  botPace: [0.82, 0.95], // bots run at this share of top speed
  botSlip: 0.05,         // chance a bot fumbles a jump (lets go of it early)
  botPause: 0.2,         // chance a bot stops to think at an obstacle
  botThinkMs: 90,        // how often a bot rethinks (its reaction time)
  sendMs: 80,            // how often your runner is sent (~12/s)
  board: "trap-wins",    // leaderboard: matches won
};
const BOT_NAMES = ["Bolt", "Gizmo", "Rivet", "Sprocket", "Widget", "Nugget", "Tinker", "Pip"];
const COLORS = ["#ff5a5f", "#3d8bff", "#ffb627", "#2fbf71", "#a463f2", "#ff7ac6", "#13c4c4", "#ff8a3d", "#8bd450", "#f2f2f2"];

// ── PIECES & LEVEL ──────────────────────────────────────────────────────────────────
// Every piece is one tile tall. trap = it can knock people out (and earns its owner points).
const PIECES = {
  P: { name: "Platform", w: 3, trap: false },
  I: { name: "Ice", w: 3, trap: false },
  T: { name: "Spring", w: 1, trap: false },
  S: { name: "Spikes", w: 2, trap: true },
  W: { name: "Saw", w: 1, trap: true },
  X: { name: "Crossbow", w: 1, trap: true },
};
// The level every match starts from. Legend (letters and symbols, never digits): . air  # ground.
// Placed pieces add: P platform, I ice, T spring, ^ spikes, X crossbow (saws aren't tiles).
const COLS = 36, ROWS = 13;
const BASE = [
  ...Array(9).fill("...................................."),
  "................####................",
  "######....###...####...###....######",
  "######....###...####...###....######",
  "######....###...####...###....######",
];
const SOLID = "#PITX", BUILD_FROM = 6, BUILD_TO = 31; // pieces go between these columns (not on the start or the flag)
const FLAG = { x: 33.5, y: 10 }, SPAWN_Y = 10;
const startX = (slot) => 1 + (slot % 8) * 0.45;
// The preview starts on a level that already has some pieces in it.
const ATTRACT_PIECES = [["P", 7, 8, 1, ""], ["W", 11, 5, 1, ""], ["T", 14, 10, 1, ""], ["I", 20, 8, 1, ""], ["X", 28, 9, -1, ""], ["W", 24, 6, 1, ""], ["S", 18, 8, 1, ""]];
let L = null; // the level as a grid, rebuilt whenever the `level` field changes
/** The level grid from the base map plus the placed pieces. occ = which piece is in each cell. */
function buildLevel(pieces, key) {
  const grid = BASE.map((r) => r.split("")), occ = BASE.map((r) => r.split("").map(() => -1)), saws = [], bows = [], springs = [];
  pieces.forEach((p, i) => {
    const [k, x, y, o] = p, d = PIECES[k];
    if (!d || y < 0 || y >= ROWS) return;
    for (let c = x; c < x + d.w && c < COLS; c++) { if (c < 0) continue; occ[y][c] = i; if (k === "S") grid[y][c] = "^"; else if (k !== "W") grid[y][c] = k; }
    if (k === "W") saws.push({ i, x, y });
    if (k === "X") bows.push({ i, x, y, o: o < 0 ? -1 : 1 });
    if (k === "T") springs.push({ i, x, y });
  });
  for (const b of bows) { let n = 0, c = b.x + b.o; while (n < 40 && c >= 0 && c < COLS && !SOLID.includes(grid[b.y][c])) { n++; c += b.o; } b.range = n + 0.5; } // arrows fly until they hit something solid
  return { key, pieces, grid, occ, saws, bows, springs };
}
const tileAt = (c, r) => (r < 0 || r >= ROWS ? "." : c < 0 || c >= COLS ? "#" : L.grid[r][c]);
const solid = (c, r) => SOLID.includes(tileAt(c, r));
/** Can piece k go at cell (x, y)? Inside the build zone, on empty cells only. */
function canPlace(k, x, y) {
  const d = PIECES[k];
  if (!d || !Number.isInteger(x) || !Number.isInteger(y) || y < 1 || y >= ROWS || x < BUILD_FROM || x + d.w > BUILD_TO) return false;
  for (let c = x; c < x + d.w; c++) if (L.grid[y][c] !== "." || L.occ[y][c] >= 0) return false;
  return true;
}

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'trap-builders',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
const $ = (id) => document.getElementById(id);

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const parsed = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) {
  const c = parsed.get(key);
  if (c && c.raw === raw) return c.v;
  const v = parse(raw, fallback); parsed.set(key, { raw, v }); return v;
}
const shared = (key, fallback) => parseOnce("s:" + key, S.shared[key], fallback);
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let hostHold = 0, lastTick = performance.now(); // lastTick: when frame() last ran; hostHold: after a freeze, no hosting before this time (see frame())
const isHost = () => performance.now() > hostHold && performance.now() - lastTick < 1000 && livePlayers()[0] === net.sessionId; // a tab whose loop has stopped doesn't host
// The shared clock: the host's Date.now() plus its own offset, learned from `clk` changes.
const clockSync = { offset: 0, seen: undefined, samples: [], lastWrite: 0 };
const clock = () => Date.now() + clockSync.offset;
function syncClock(now) {
  if (isHost()) { if (now - clockSync.lastWrite > 2000) { clockSync.lastWrite = now; net.setShared("clk", clock()); } return; }
  const clk = Number(S.shared.clk);
  if (!clk || clk === clockSync.seen) return;
  if (clockSync.seen !== undefined) { // the first value we see may be old; later changes are fresh
    clockSync.samples = [...clockSync.samples.slice(-4), clk - Date.now()];
    clockSync.offset = Math.max(...clockSync.samples); // the least-delayed sample is the best
  }
  clockSync.seen = clk;
}
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ── HAZARDS ─────────────────────────────────────────────────────────────────────────
/** Where a saw's middle is at clock time t (seconds): it swings left and right. */
const sawAt = (s, t) => ({ x: s.x + 0.5 + CONFIG.sawRange * Math.sin((t * Math.PI * 2) / CONFIG.sawPeriod + s.i * 1.7), y: s.y + 0.5 });
/** The x of every arrow in flight from crossbow w at time t (they fly along its row). */
function arrowsOf(w, t) {
  const per = CONFIG.bowPeriod, out = [];
  for (let age = (((t + w.i * 0.77) % per) + per) % per; age * CONFIG.arrowSpeed < w.range; age += per) out.push(w.x + 0.5 + w.o * (0.5 + age * CONFIG.arrowSpeed));
  return out;
}
/** Which piece (its index in the level) is hurting runner b right now, or null. */
function hazardAt(b, t) {
  for (let r = Math.floor(b.y - HH); r <= Math.floor(b.y - 0.01); r++) for (let c = Math.floor(b.x - HW); c <= Math.floor(b.x + HW); c++)
    if (tileAt(c, r) === "^" && b.x + HW > c + 0.15 && b.x - HW < c + 0.85 && b.y > r + 0.45) return L.occ[r][c];
  const cy = b.y - HH / 2;
  for (const s of L.saws) { const p = sawAt(s, t), dx = Math.max(0, Math.abs(p.x - b.x) - HW), dy = Math.max(0, Math.abs(p.y - cy) - HH / 2); if (dx * dx + dy * dy < CONFIG.sawRadius * CONFIG.sawRadius * 0.8) return s.i; }
  for (const w of L.bows) { const ay = w.y + 0.5; if (ay < b.y - HH + 0.05 || ay > b.y - 0.05) continue; for (const ax of arrowsOf(w, t)) if (Math.abs(ax - b.x) < HW + 0.3) return w.i; }
  return null;
}

// ── RUNNERS ─────────────────────────────────────────────────────────────────────────
const HW = 0.34, HH = 0.9; // half width and height of a runner, in tiles (x is the middle, y the feet)
function placeRunner(b, x, y) { return Object.assign(b, { x, y, py: y, vx: 0, vy: 0, ground: null, coyote: 0, buffer: 0, boosted: false, dead: false, fin: 0, killer: -1 }); }
const newRunner = (x, y) => placeRunner({ f: 1, pace: 1, plan: null, cur: { dir: 0 }, thinkAt: 0, waitUntil: 0, edge: false, bestX: 0, progressAt: 0 }, x, y);
const anim = (b) => (!b.ground ? 2 : Math.abs(b.vx) > 0.8 ? 1 : 0);
/** One physics step. input = { dir -1|0|1, jump (pressed now), held }. t = clock seconds. Returns "jump", "land", "spring", "dead" or null. */
function stepRunner(b, inp, dt, t) {
  if (b.dead || b.fin) return null;
  let ev = null;
  const dir = inp.dir || 0, grip = !b.ground ? CONFIG.airControl : b.ground.tile === "I" ? CONFIG.iceGrip : CONFIG.groundGrip;
  b.vx += (dir * CONFIG.run * (b.ground ? b.pace || 1 : 1) - b.vx) * Math.min(1, grip * dt); // pace (bots) slows running, never jumps
  if (dir) b.f = dir;
  b.coyote = b.ground ? CONFIG.coyote : b.coyote - dt;
  b.buffer = inp.jump ? CONFIG.buffer : b.buffer - dt;

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
const wake = () => { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } };
const KEYS = { arrowleft: "left", a: "left", arrowright: "right", d: "right" }, JUMPS = [" ", "arrowup", "w", "z"];
addEventListener("keydown", (e) => {
  wake(); const k = e.key.toLowerCase(), g = game();
  if (g && g.phase === "place") { // keys move the ghost while placing
    const mv = { arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0], arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1] }[k];
    if (mv) { e.preventDefault(); moveGhost(...mv); }
    if (k === "r" || k === "f") me.ghost.o = -me.ghost.o;
    if (k === "enter" || k === " ") { e.preventDefault(); tryPlace(); }
    return;
  }
  if (g && g.phase === "pick" && /^[1-9]$/.test(k)) tryPick(Number(k) - 1);
  if (KEYS[k]) { e.preventDefault(); input[KEYS[k]] = true; }
  if (JUMPS.includes(k)) { e.preventDefault(); if (!e.repeat) input.jump = true; input.held = true; }
});
addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); if (KEYS[k]) input[KEYS[k]] = false; if (JUMPS.includes(k)) input.held = false; });
addEventListener("blur", () => { input.left = input.right = input.held = false; });
for (const b of document.querySelectorAll("#padL button, #padR button")) {
  const k = b.dataset.k;
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); wake(); b.setPointerCapture(e.pointerId); if (k === "jump") { input.jump = input.held = true; } else input[k] = true; b.classList.add("on"); });
  for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, () => { if (k === "jump") input.held = false; else input[k] = false; b.classList.remove("on"); });
}
for (const b of document.querySelectorAll("#padG button, #padP button")) {
  b.addEventListener("pointerdown", (e) => {
    e.preventDefault(); wake(); const k = b.dataset.g;
    if (k === "place") tryPlace(); else if (k === "flip") me.ghost.o = -me.ghost.o;
    else moveGhost(...{ left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[k]);
  });
}
/** The pointer → the cell under it, through the camera the frame was drawn with. */
function ghostToPointer(e) {
  const g = game(), i = g ? itemOf(g, me.id) : -1;
  if (!g || g.phase !== "place" || i < 0 || g.box[i].pl) return false;
  const rect = cv.getBoundingClientRect(), wx = (e.clientX - rect.left - cam.ox) / TS + cam.x, wy = (e.clientY - rect.top - cam.oy) / TS;
  const w = PIECES[g.box[i].k].w;
  me.ghost.x = Math.max(0, Math.min(COLS - w, Math.round(wx - w / 2))); me.ghost.y = Math.max(1, Math.min(ROWS - 1, Math.floor(wy)));
  return true;
}
cv.addEventListener("pointerdown", (e) => { wake(); if (ghostToPointer(e) && e.pointerType === "mouse") tryPlace(); });
cv.addEventListener("pointermove", (e) => { if (e.pointerType === "mouse" || e.buttons) ghostToPointer(e); });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0, dtNow = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (performance.now() - lastTick > 1000) { hostHold = performance.now() + 700; host.acting = false; } // the tab was frozen or in the background: someone else may have hosted meanwhile, so let its state arrive, then adopt it
  lastTick = performance.now(); // not the rAF time: after a long freeze Chrome can stamp the first frame from before it ended
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; dtNow = dt; // the first frame can be timed before load: never negative
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  syncClock(now);
  ensureLevel();
  if (isHost()) hostTick(dt, now); else host.acting = false;
  const g = game();
  if (g) { syncViews(dt, g); myTick(dt, now, clock() / 1000, g); phaseFx(g); }
  tickFx(dt);
  draw(g, now);
  if (g && now - lastHud > 120) { lastHud = now; hud(g); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("pick", (msg, from) => { if (host.acting && msg) applyPick(from, Number(msg.r), Number(msg.i)); });
  net.on("place", (msg, from) => { if (host.acting && msg) applyPlace(from, { r: Number(msg.r), x: msg.x, y: msg.y, o: Number(msg.o) }); });
  net.on("again", () => { if (host.acting) host.again = true; });
  net.onDisconnect(() => { reconnecting = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { reconnecting = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...(shared("game", null)?.pl || []).map((e) => e.c)]);
  me.id = net.sessionId; me.color = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { seats: 6, pickMs: 1300, placeMs: 2400, countdown: 400, runMs: 7000, scoreMs: 1400, botPause: 0, boxWeights: { P: 3, I: 1, T: 1 } }); // the preview's traps are already placed
  startedAt = performance.now();
  requestAnimationFrame(frame);
})();
</script>
